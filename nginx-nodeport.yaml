# ==================================================
# Kubernetes Nginx Deployment Example
# Resources:
# 1. Namespace
# 2. Pod
# 3. NodePort Service
# ==================================================

# Create Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: dev

---
# Create Nginx Pod
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  namespace: dev
  labels:
    app: nginx
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80

---
# Create NodePort Service
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  namespace: dev
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080

# ==================================================
# Explanation
#
# Namespace: dev
#
# Pod:
#   Name: nginx-pod
#   Label: app=nginx
#
# Service:
#   Name: nginx-nodeport
#   Type: NodePort
#   Selector: app=nginx
#
# Traffic Flow:
#   Browser
#      |
#      v
#   NodeIP:30080
#      |
#      v
#   NodePort Service
#      |
#      v
#   nginx-pod:80
#
# Deploy:
#   kubectl apply -f nginx-nodeport.yaml
#
# Verify:
#   kubectl get pods -n dev
#   kubectl get svc -n dev
#
# Access:
#   http://<Node-IP>:30080
#
# Delete:
#   kubectl delete -f nginx-nodeport.yaml
# ==================================================
